name: Make an advent calendar

# Builds one advent calendar to your recipe: every box, every numbered lid,
# the keys that join them and the panels for the outside. Answer the
# questions, run it, and download the zip from the run (or publish it as a
# release). GitHub allows ten questions, so the box size is one answer.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days (boxes)"
        required: true
        default: "25"
      shape:
        description: "Shape of each box"
        required: true
        default: "Square box"
        type: choice
        options: ["Square box", "Hexagon", "Triangle", "Cylinder"]
      size:
        description: "Box size in mm as width x length x height (length only matters for a square box)"
        required: true
        default: "48 x 48 x 40"
      motif:
        description: "Motif drawn round the number on each lid"
        required: true
        default: "Christmas tree (star on the top box)"
        type: choice
        options:
          - "Christmas tree (star on the top box)"
          - "Circle"
          - "Square"
          - "Star"
          - "Heart"
          - "Snowflake"
          - "Just the number"
      number:
        description: "How the number stands on the lid"
        required: true
        default: "Raised (easy to paint, or print in a second colour)"
        type: choice
        options:
          - "Raised (easy to paint, or print in a second colour)"
          - "Recessed (cut into the lid)"
      lego:
        description: "Add Lego-compatible studs round the motif?"
        required: true
        default: "No"
        type: choice
        options: ["No", "Yes"]
      outside:
        description: "Finish on the outside panels"
        required: true
        default: "Brick"
        type: choice
        options: ["Brick", "Plain", "Honeycomb", "Diamond", "Grid", "Round", "Triangle", "Windows"]
      layout:
        description: "How the boxes go together"
        required: true
        default: "Tree (rows of 1, 3, 5, 7, 9)"
        type: choice
        options:
          - "Tree (rows of 1, 3, 5, 7, 9)"
          - "Grid"
          - "Single row"
      numbering:
        description: "Where the numbers go"
        required: true
        default: "Last day at the top (25 on the star)"
        type: choice
        options:
          - "Last day at the top (25 on the star)"
          - "First day at the top"
          - "Scattered, so they have to hunt for today"
      publish:
        description: "Publish it as a GitHub release when done? (Otherwise the zip stays with this run for 90 days)"
        required: true
        default: "No"
        type: choice
        options: ["No", "Yes"]

permissions:
  contents: read

jobs:
  make:
    name: Make it
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -e .

      - name: Turn the answers into options
        id: opts
        env:
          SHAPE: ${{ inputs.shape }}
          SIZE: ${{ inputs.size }}
          MOTIF: ${{ inputs.motif }}
          NUMBER: ${{ inputs.number }}
          LEGO: ${{ inputs.lego }}
          OUTSIDE: ${{ inputs.outside }}
          LAYOUT: ${{ inputs.layout }}
          NUMBERING: ${{ inputs.numbering }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          # The first word of an answer, without any comma or bracket after it.
          first = lambda text: re.split(r"[\s,(]+", text.strip())[0].lower()
          size = [float(v) for v in re.findall(r"[\d.]+", os.environ["SIZE"])]
          if len(size) != 3:
              raise SystemExit(f"size should look like '48 x 48 x 40', got {os.environ['SIZE']!r}")
          shape = {"square": "box", "hexagon": "hexagon", "triangle": "triangle",
                   "cylinder": "cylinder"}[first(os.environ["SHAPE"])]
          motif = {"christmas": "tree", "just": "none"}.get(
              first(os.environ["MOTIF"]), first(os.environ["MOTIF"]))
          layout = {"tree": "tree", "grid": "grid", "single": "row"}[first(os.environ["LAYOUT"])]
          numbering = {"last": "reversed", "first": "ordered",
                       "scattered": "scattered"}[first(os.environ["NUMBERING"])]
          args = [
              "--days", os.environ["DAYS"].strip(),
              "--shape", shape,
              "--width", str(size[0]), "--length", str(size[1]), "--height", str(size[2]),
              "--frame", motif,
              "--number", first(os.environ["NUMBER"]),
              "--lego", "yes" if os.environ["LEGO"].lower().startswith("y") else "no",
              "--skin", first(os.environ["OUTSIDE"]),
              "--arrangement", layout,
              "--numbering", numbering,
          ]
          print("args=" + " ".join(args))
          PY
          echo "Building with: $(grep '^args=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the calendar
        run: |
          set -euo pipefail
          storagegen advent-calendar ${{ steps.opts.outputs.args }} --out out

      # Every mesh is re-read from disk and checked for holes, flipped faces
      # and stray pieces, so a bad file cannot reach the zip.
      - name: Check every model
        run: storagegen verify out --json out/verify.json

      - name: Name it
        id: name
        run: |
          set -euo pipefail
          SLUG=$(ls out | head -1)
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat "out/${SLUG}/listing.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.slug }}
          path: out/
          retention-days: 90

      - name: Publish as a release
        if: inputs.publish == 'Yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.slug }}
        run: |
          set -euo pipefail
          ( cd out && zip -qr "../${TAG}.zip" . )
          TITLE=$(python -c 'import json; print(json.load(open("out/'"${TAG}"'/listing.json"))["title"])')
          NOTES="out/${TAG}/listing.md"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${TAG}.zip" --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES}"
          else
            gh release create "${TAG}" "${TAG}.zip" --target "${GITHUB_SHA}" \
              --title "${TITLE}" --notes-file "${NOTES}"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Published: $(gh release view "${TAG}" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
